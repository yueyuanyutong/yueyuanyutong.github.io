# 「笔记」分区配置
#
# 文件夹就是分区，这个文件只负责两件事：英文别名、首页排序。
# 新建分区时，在 source/_notes/ 下建同名文件夹即可，不配这里也能用。

# 顶层分区在首页的显示顺序（只影响排序，不会让有笔记的分区消失）
home:
  - 计算机
  - 考研
  - 考公

# 分区名的英文别名 —— 只影响地址栏，不改文件夹名
# 例：文件夹叫「计算机/网络」，加上下面的映射后地址栏是 /notes/computer/network/
# 没配置的分区会直接使用中文名，地址栏会出现 %E8%AE%A1 这样的编码字符（能用，但不好看）
aliases:
  计算机: computer
  网络: network
  工具: tools
  踩坑: pitfalls
  考研: postgrad
  考公: civil-service
  阅读: reading
